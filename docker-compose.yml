# Environnement de développement complet : base, capture des e-mails, API et interface.
# Usage : cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intervit}
      POSTGRES_USER: ${POSTGRES_USER:-intervit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intervit}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intervit} -d ${POSTGRES_DB:-intervit}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]   # 8025 : interface web de consultation des e-mails capturés

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-local}
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-intervit}
      DATABASE_USER: ${POSTGRES_USER:-intervit}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-intervit}
      JWT_SECRET: ${JWT_SECRET:-changeme-changeme-changeme-changeme-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8081}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AI_ENABLED: ${AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-1.00}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /api
    ports: ["8081:80"]
    depends_on: [backend]

volumes:
  pgdata:
