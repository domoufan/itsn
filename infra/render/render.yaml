# Blueprint Render (Infrastructure as Code) — état réel des services créés le 14/11/2026.
# Les deux services API sont construits par Render depuis backend/Dockerfile au commit indiqué par la chaîne CD
# (deploy hook + ref=<sha>) ; l'auto-déploiement est désactivé pour que seule la CD décide des mises à jour.
# La base PostgreSQL est hébergée chez Neon (projet itsn, branches main et staging) ; ses identifiants sont saisis
# dans Render (sync: false) et ne figurent jamais dans le dépôt.
services:
  - type: web
    name: itsn-api-staging
    runtime: docker
    repo: https://github.com/domoufan/itsn
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: false
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://itsn.onrender.com,https://itsn-api-staging.onrender.com
      - key: SEED_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_VERSION
        value: staging

  - type: web
    name: itsn-api
    runtime: docker
    repo: https://github.com/domoufan/itsn
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: false
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://itsn.onrender.com
      - key: SEED_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_BUDGET_USD
        value: "1.00"
      - key: APP_VERSION
        value: production

  - type: web
    name: itsn
    runtime: static
    repo: https://github.com/domoufan/itsn
    branch: main
    buildCommand: cd frontend && npm ci && npm run build -- --configuration production
    staticPublishPath: frontend/dist/frontend/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://itsn-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
