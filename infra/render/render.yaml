# Blueprint Render (Infrastructure as Code) – à importer depuis le tableau de bord Render.
# Deux services web (préproduction / production) déployés depuis les images publiées par la CI sur GHCR,
# un site statique pour l'interface Angular. La base PostgreSQL est hébergée chez Neon (offre gratuite) :
# l'URL JDBC est fournie en secret, jamais versionnée.
services:
  - type: web
    name: itsn-api-staging
    runtime: image
    image:
      url: ghcr.io/domoufan/itsn-backend:latest   # remplacé à chaque livraison par le deploy hook (imgURL=…)
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: DATABASE_URL
        sync: false          # saisi dans Render (secret)
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true  # généré par Render, jamais versionné
      - key: CORS_ALLOWED_ORIGINS
        value: https://itsn-staging.onrender.com
      - key: SEED_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_VERSION
        value: staging

  - type: web
    name: itsn-api
    runtime: image
    image:
      url: ghcr.io/domoufan/itsn-backend:latest
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://itsn.onrender.com
      - key: SEED_ENABLED
        value: "true"        # jeu de données fictives pour la démonstration (à désactiver chez un vrai client)
      - key: AI_ENABLED
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_BUDGET_USD
        value: "1.00"

  - type: web
    name: itsn
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build -- --configuration production
    staticPublishPath: frontend/dist/frontend/browser
    routes:
      - type: rewrite
        source: /api/*
        destination: https://itsn-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
