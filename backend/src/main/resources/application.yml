spring:
  application:
    name: intervit-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/intervit}
    username: ${DATABASE_USER:intervit}
    password: ${DATABASE_PASSWORD:intervit}
  jpa:
    hibernate:
      ddl-auto: validate          # le schéma est géré exclusivement par Flyway
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: IntervIT
    version: ${APP_VERSION:dev}
    commit: ${GIT_COMMIT:local}

intervit:
  security:
    # Secret HMAC-SHA256 pour signer les JWT : >= 32 caractères, à surcharger en production
    jwt-secret: ${JWT_SECRET:changeme-changeme-changeme-changeme-0123456789}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  notifications:
    email-enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_FROM:support@senetech.example}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: anthropic
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${AI_MODEL:claude-haiku-4-5}
    max-tokens: 1024
    max-tool-calls: 6
    timeout-seconds: 30
    daily-budget-usd: ${AI_DAILY_BUDGET_USD:1.00}
    # Tarif indicatif (USD par million de jetons) pour l'estimation de coût ; à ajuster selon la grille publique
    price-input-per-mtok: 1.00
    price-output-per-mtok: 5.00
  demo:
    seed-enabled: ${SEED_ENABLED:true}

logging:
  level:
    root: INFO
    sn.senetech.intervit: INFO
